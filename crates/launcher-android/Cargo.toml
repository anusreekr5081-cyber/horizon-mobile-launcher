[package]
name = "horizon-launcher-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Rust Android host and touch bridge for Horizon 26.3"

[lib]
name = "horizon_launcher_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-mobile-core = { path = "../launcher-core" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
libc = "0.2"
jni = "0.21"
