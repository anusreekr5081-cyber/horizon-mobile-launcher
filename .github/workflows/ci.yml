name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p horizon-mobile-core -- -D warnings
      - run: cargo test -p horizon-mobile-core
